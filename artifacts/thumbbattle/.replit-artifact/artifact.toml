kind = "web"
previewPath = "/"
title = "Thumbz"
version = "1.0.0"
id = "artifacts/thumbbattle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22509

[services.development]
run = "pnpm --filter @workspace/thumbbattle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thumbbattle", "run", "build" ]
publicDir = "artifacts/thumbbattle/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22509"
BASE_PATH = "/"
