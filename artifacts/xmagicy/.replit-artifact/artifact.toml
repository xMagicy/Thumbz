kind = "web"
previewPath = "/xmagicy/"
title = "xMagicy"
version = "1.0.0"
id = "artifacts/xmagicy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/xmagicy/" ]
localPort = 24902

[services.development]
run = "pnpm --filter @workspace/xmagicy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xmagicy", "run", "build" ]
publicDir = "artifacts/xmagicy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24902"
BASE_PATH = "/xmagicy/"
