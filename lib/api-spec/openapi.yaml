openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ThumbBattle API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: thumbnails
    description: Thumbnail operations
  - name: battles
    description: Battle/voting operations
  - name: feedback
    description: User feedback operations
  - name: waitlist
    description: Upload-feature waitlist signups
  - name: storage
    description: Object storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /thumbnails:
    get:
      operationId: listThumbnails
      tags: [thumbnails]
      summary: List active thumbnails
      description: Returns thumbnails with status="active", optionally filtered by niche and sorted.
      parameters:
        - name: niche
          in: query
          required: false
          schema:
            type: string
          description: Filter to a specific niche (case-insensitive). Omit or "all" returns all niches.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [elo, winRate, ctr, battles, rising]
          description: Sort order for the rankings. Defaults to elo.
      responses:
        "200":
          description: List of thumbnails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thumbnail"
    post:
      operationId: uploadThumbnail
      tags: [thumbnails]
      summary: Submit a user-uploaded thumbnail
      description: Records a thumbnail with status="active" so it enters the battle pool immediately. Returns the created row so the client can route the user straight into a battle that includes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadThumbnailRequest"
      responses:
        "201":
          description: Thumbnail submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thumbnail"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thumbnails/battle:
    get:
      operationId: getBattlePair
      tags: [thumbnails]
      summary: Get one or more random battle pairs
      description: |
        Returns a queue of distinct random active thumbnail pairs to compare,
        optionally filtered by niche. Used by the client to maintain a local
        prefetched queue so swipes feel instant. Pass `count` to fetch
        multiple pairs in one round-trip.
      parameters:
        - name: niche
          in: query
          required: false
          schema:
            type: string
          description: Restrict the battle pairs to a specific niche.
        - name: count
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
          description: |
            How many pairs to return. Server may return fewer if the niche
            does not have enough active thumbnails to satisfy the request.
            Always at least 1 on a 200 response.
      responses:
        "200":
          description: One or more thumbnail pairs for battles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleQueueResponse"
        "400":
          description: Not enough thumbnails for a battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thumbnails/{id}/rating-history:
    get:
      operationId: getThumbnailRatingHistory
      tags: [thumbnails]
      summary: Get a thumbnail's rating history
      description: |
        Returns the recorded ELO rating points for a thumbnail in chronological
        order (oldest first). Each point is a snapshot recorded after a battle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rating history points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingHistoryResponse"
        "404":
          description: Thumbnail not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /battles:
    get:
      operationId: listBattles
      tags: [battles]
      summary: Get battle stats
      description: Returns total vote count and recent battle history
      responses:
        "200":
          description: Battle stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleStats"

  /battles/vote:
    post:
      operationId: castVote
      tags: [battles]
      summary: Cast a vote
      description: Record a vote for a winner against a loser, updates win/loss counts and ELO ratings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteBody"
      responses:
        "200":
          description: Updated thumbnails after vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Thumbnail not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit beta feedback
      description: Records a piece of feedback from a visitor while the site is in beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackBody"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the upload-feature waitlist
      description: Records an email so we can notify the user when thumbnail uploads ship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistBody"
      responses:
        "201":
          description: Waitlist signup recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      description: Returns a presigned PUT URL the client uploads the file to directly, plus the object path to store in your DB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned URL ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlInfo"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Thumbnail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        imageUrl:
          type: string
        channelName:
          type: string
        channelId:
          type: ["string", "null"]
          description: YouTube channelId for YouTube-sourced rows; null for user uploads.
        channelLogoUrl:
          type: ["string", "null"]
          description: Channel avatar URL (YouTube snippet.thumbnails.medium.url); null for user uploads.
        niche:
          type: string
          description: One of Gaming, Tutorial, Finance, Music, Lifestyle, Tech, Vlog, Other
        ctr:
          type: ["number", "null"]
          description: Click-through rate as a percentage (0-100), null if not provided
        youtubeUrl:
          type: ["string", "null"]
          description: Optional public YouTube link to verify the thumbnail
        status:
          type: string
          description: active or pending
        wins:
          type: integer
        losses:
          type: integer
        eloRating:
          type: integer
        winRate:
          type: ["number", "null"]
          description: Win rate as a percentage (0-100), null if no battles
        recentRatings:
          type: array
          items:
            type: integer
          description: |
            Most recent rating snapshots for this thumbnail (chronological,
            oldest first, up to 20 points). Embedded so leaderboard
            sparklines can render without N+1 per-row fetches. Empty array
            for thumbnails that have not battled yet.
        source:
          type: string
          description: Provenance — "user", "youtube", or "seed".
        youtubeVideoId:
          type: ["string", "null"]
          description: Source YouTube videoId for thumbnails pulled via trending sync.
        viewCount:
          type: ["integer", "null"]
          description: Latest YouTube view count snapshot (null for non-YouTube rows).
        viewVelocity:
          type: ["number", "null"]
          description: |
            Views-per-hour (FPH) computed from the delta between the last
            two view snapshots. Null until we have at least two snapshots.
            This is the "rising" signal — sort by this DESC for trending.
        publishedAt:
          type: ["string", "null"]
          format: date-time
          description: When the source YouTube video was published.
        appCategory:
          type: ["string", "null"]
          description: |
            Canonical category bucket used for matchmaking and leaderboard
            filtering (Blok 5). Mirrors `niche` for user uploads; for
            YouTube rows it's the hybrid classifier output. Treat as the
            primary bucket; fall back to `niche` only when null (legacy).
        battleCount:
          type: integer
          description: |
            Total battles this thumbnail has been in (winner OR loser).
            Drives the upload boost decay (3.0x <10, 1.5x <20, 1.0x else)
            and the "Calibrating" badge while battleCount < 20.
        archived:
          type: boolean
          description: |
            Soft-delete flag. Archived thumbnails are excluded from battle
            pairing and the leaderboard. Set by the daily curation cron and
            by the per-user upload cap (>5 active uploads → oldest archived).
      required:
        - id
        - title
        - imageUrl
        - channelName
        - niche
        - status
        - wins
        - losses
        - eloRating
        - source
        - battleCount
        - archived

    UploadThumbnailRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        channelName:
          type: string
          minLength: 1
          maxLength: 120
        niche:
          type: string
          enum: [Gaming, Tutorial, Finance, Music, Lifestyle, Tech, Vlog, Other]
        imageUrl:
          type: string
          minLength: 1
          maxLength: 1000
          description: Object path returned from /storage/uploads/request-url, or a remote https URL.
        ctr:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
          description: Optional CTR percentage (0-100)
        youtubeUrl:
          type: ["string", "null"]
          maxLength: 500
          description: Optional public YouTube URL for verification
      required:
        - title
        - channelName
        - niche
        - imageUrl

    BattlePair:
      type: object
      properties:
        left:
          $ref: "#/components/schemas/Thumbnail"
        right:
          $ref: "#/components/schemas/Thumbnail"
      required:
        - left
        - right

    BattleQueueResponse:
      type: object
      properties:
        pairs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/BattlePair"
      required:
        - pairs

    VoteBody:
      type: object
      properties:
        winnerId:
          type: integer
        loserId:
          type: integer
      required:
        - winnerId
        - loserId

    VoteResult:
      type: object
      properties:
        winner:
          $ref: "#/components/schemas/Thumbnail"
        loser:
          $ref: "#/components/schemas/Thumbnail"
        totalVotes:
          type: integer
      required:
        - winner
        - loser
        - totalVotes

    BattleStats:
      type: object
      properties:
        totalVotes:
          type: integer
        totalUploads:
          type: integer
          description: All-time count of user-submitted thumbnails (source='user').
        recentBattles:
          type: array
          items:
            $ref: "#/components/schemas/RecentBattle"
      required:
        - totalVotes
        - totalUploads
        - recentBattles

    RecentBattle:
      type: object
      properties:
        id:
          type: integer
        winnerId:
          type: integer
        loserId:
          type: integer
        winnerTitle:
          type: string
        loserTitle:
          type: string
        createdAt:
          type: string
      required:
        - id
        - winnerId
        - loserId
        - winnerTitle
        - loserTitle
        - createdAt

    FeedbackBody:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: The visitor's feedback message
        email:
          type: ["string", "null"]
          description: Optional email address so the team can reply
        pageUrl:
          type: ["string", "null"]
          description: The URL the visitor was on when sending feedback
      required:
        - message

    FeedbackResult:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - createdAt

    WaitlistBody:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Email address to notify when uploads launch
      required:
        - email

    WaitlistResult:
      type: object
      properties:
        id:
          type: integer
        signedUpAt:
          type: string
      required:
        - id
        - signedUpAt

    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - name
        - size
        - contentType

    UploadUrlInfo:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string
          required:
            - name
            - size
            - contentType
      required:
        - uploadURL
        - objectPath
        - metadata

    RatingHistoryPoint:
      type: object
      properties:
        rating:
          type: integer
        createdAt:
          type: string
      required:
        - rating
        - createdAt

    RatingHistoryResponse:
      type: object
      properties:
        thumbnailId:
          type: integer
        currentRating:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/RatingHistoryPoint"
      required:
        - thumbnailId
        - currentRating
        - points

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
